[pytest]
minversion = 7.4
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %H:%M:%S
markers =
    cpu: tests that exercise CPU compute
    memory: tests that exercise the memory subsystem
    gpu: tests that require NVIDIA GPU(s)
    nvlink: tests that require NVLink fabric
    pcie: tests that measure PCIe host<->device bandwidth
    bottleneck: bottleneck / roofline analysis tests
    slow: tests that take more than 30 s to complete
    node_validation: node validation and bring-up tests
    gpu_enumeration: GPU enumeration and topology tests
    pcie_validation: PCIe bandwidth validation tests
    memory_validation: memory type validation tests
    p2p_validation: GPU P2P bandwidth tests
    sync_overhead: CPU-GPU sync overhead tests
    power_validation: power and thermal tests
    nccl_validation: NCCL and inter-GPU communication tests
    workload_acceptance: workload acceptance tests
    rdma_validation: RDMA/MMIO/FENCE/DMA functional validation tests
