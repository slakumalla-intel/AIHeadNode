[pytest]
minversion = 7.4
testpaths = tests
addopts =
    -v
    --tb=short
    --strict-markers
    -p no:cacheprovider
log_cli = true
log_cli_level = INFO
log_format = %(asctime)s %(levelname)-8s %(name)s %(message)s
log_date_format = %H:%M:%S
markers =
    cpu: tests that exercise CPU compute
    cpu_headnode: CPU<->GPU integration tests for head-node serving scenarios
    memory: tests that exercise the memory subsystem
    gpu: tests that require NVIDIA GPU(s)
    nvlink: tests that require NVLink fabric
    pcie: tests that measure PCIe host<->device bandwidth
    bottleneck: bottleneck / roofline analysis tests
    slow: tests that take more than 30 s to complete
    node_validation: node validation and bring-up tests
    gpu_enumeration: GPU enumeration and topology tests
    pcie_validation: PCIe bandwidth validation tests
    memory_validation: memory type validation tests
    p2p_validation: GPU P2P bandwidth tests
    sync_overhead: CPU-GPU sync overhead tests
    power_validation: power and thermal tests
    nccl_validation: NCCL and inter-GPU communication tests
    workload_acceptance: workload acceptance tests
    rdma_validation: RDMA/MMIO/FENCE/DMA functional validation tests
    ai_pipeline: all AI pipeline KPI tests (data loading, model orch, storage, inference)
    data_loading: data loading and preprocessing KPI tests
    model_orch: model orchestration KPI tests (load time, checkpoint, KV cache, TP)
    storage_net_io: storage and networking I/O KPI tests
    inference_kpis: inference pipeline KPI tests (TTFT, ITL, batching, GPU util)
    system_health: all system health and reliability tests
    thermal_stability: GPU thermal limits and clock throttle detection
    ecc_link_health: GPU ECC error counts and PCIe link health
    energy_efficiency: GFLOPS/W energy efficiency measurements
    quant_correctness: FP8/INT8/BF16 quantisation numerical correctness
    ddp_correctness: DDP/NCCL gradient synchronisation correctness
    compile_correctness: torch.compile correctness and speedup validation
    stream_correctness: CUDA stream ordering and event synchronisation correctness
    agentic_ai: agentic AI workload validation tests (CPU+GPU agent reasoning, tools, state)
    tool_invocation: tool dispatch, scheduling, and collection overhead tests
    tool_parallelism: parallel tool execution efficiency tests
    reasoning_latency: GPU-based reasoning phase latency tests
    cpu_gpu_sync: CPU-GPU synchronization overhead tests
    multi_turn: multi-turn conversation and dialog KPI tests
    memory_intensive: high memory usage and bandwidth tests
    agent_state: agent state management and serialization tests
    latency_analysis: latency percentile and SLA compliance tests
